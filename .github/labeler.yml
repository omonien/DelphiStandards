# A needs-sync label is set only if ONE file of a DE/EN pair changed and the other did not.
# Both conditions are wrapped in "all:" so they are AND-ed (top-level entries are OR-ed).

needs-sync:
  - all:
      - changed-files:
          - any-glob-to-any-file: "Delphi Style Guide DE.md"
          - all-globs-to-all-files: "!Delphi Style Guide EN.md"

needs-sync-style-guide-en:
  - all:
      - changed-files:
          - any-glob-to-any-file: "Delphi Style Guide EN.md"
          - all-globs-to-all-files: "!Delphi Style Guide DE.md"

needs-sync-readme:
  - all:
      - changed-files:
          - any-glob-to-any-file: "README.md"
          - all-globs-to-all-files: "!README.de.md"

needs-sync-readme-de:
  - all:
      - changed-files:
          - any-glob-to-any-file: "README.de.md"
          - all-globs-to-all-files: "!README.md"
